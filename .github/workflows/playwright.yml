name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Setup Java (for Firebase Emulators)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check & Lint
      run: |
        npx tsc --noEmit
        npm run lint --if-present
        
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Install Firebase Tools
      run: npm install -g firebase-tools

    - name: Build Next.js App
      run: npm run build
      env:
        NEXT_PUBLIC_USE_EMULATOR: "true"
        NEXT_PUBLIC_ADMIN_EMAIL: "sravan.yerram1988@gmail.com"
        NEXT_PUBLIC_FIREBASE_API_KEY: "dummy"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-milk"
        
    - name: Run Playwright tests
      run: npx firebase emulators:exec --project=demo-milk 'npx playwright test'
      env:
        NEXT_PUBLIC_USE_EMULATOR: "true"
        NEXT_PUBLIC_ADMIN_EMAIL: "sravan.yerram1988@gmail.com"
        NEXT_PUBLIC_FIREBASE_API_KEY: "dummy"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-milk"
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30